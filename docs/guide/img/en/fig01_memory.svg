<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-label="The memory problem">
<title>The memory problem</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0.0" y="0.0" width="1000.0" height="420.0" rx="0" fill="#F6F5F0"/>
<text x="32.0" y="44.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0F1B2D" text-anchor="start">The memory problem</text>
<text x="32.0" y="70.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5F6979" text-anchor="start">Memory, not compute, limits long context and large indexes.</text>
<text x="32.0" y="108.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F1B2D" text-anchor="start">Llama-3.1-8B in FP16: the KV cache grows with every token</text>
<text x="32.0" y="148.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2433" text-anchor="start">Model weights</text>
<rect x="270.0" y="132.0" width="352.0" height="24.0" rx="4" fill="#C9CED6"/>
<text x="630.0" y="150.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#1B2433" text-anchor="start">16 GB</text>
<text x="32.0" y="192.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2433" text-anchor="start">KV cache, 8k tokens</text>
<rect x="270.0" y="176.0" width="22.0" height="24.0" rx="4" fill="#2F6DB5"/>

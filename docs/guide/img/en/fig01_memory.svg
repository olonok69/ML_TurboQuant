<text x="32.0" y="236.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#1B2433" text-anchor="start">KV cache, 32k tokens</text>
<rect x="270.0" y="220.0" width="88.0" height="24.0" rx="4" fill="#2F6DB5"/>

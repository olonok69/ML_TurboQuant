<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" role="img" aria-label="The hidden tax of classic quantization">
<title>The hidden tax of classic quantization</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<rect x="0.0" y="0.0" width="1000.0" height="360.0" rx="0" fill="#F6F5F0"/>
<text x="32.0" y="44.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#0F1B2D" text-anchor="start">The hidden tax of classic quantization</text>
<text x="32.0" y="70.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#5F6979" text-anchor="start">Bits needed to store one 128-number vector (one attention head).</text>
<text x="32.0" y="122.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F1B2D" text-anchor="start">INT4, groups of 32</text>
<rect x="230.0" y="104.0" width="435.2" height="28.0" rx="3" fill="#2F6DB5"/>
<text x="236.0" y="123.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start">512 codes</text>
<rect x="665.2" y="104.0" width="108.8" height="28.0" rx="3" fill="#B4521A"/>
<text x="784.0" y="123.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2433" text-anchor="start">+128  =  5.000 bits per number</text>
<text x="32.0" y="174.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1B2D" text-anchor="start">TurboQuant 4-bit</text>
<rect x="230.0" y="156.0" width="435.2" height="28.0" rx="3" fill="#2F6DB5"/>
<text x="236.0" y="175.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start">512 codes</text>
<rect x="665.2" y="156.0" width="13.6" height="28.0" rx="3" fill="#F2A35E"/>
<text x="688.8" y="175.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2433" text-anchor="start">+16  =  4.125 bits per number</text>
<text x="32.0" y="240.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F1B2D" text-anchor="start">INT2, groups of 32</text>
<rect x="230.0" y="222.0" width="217.6" height="28.0" rx="3" fill="#2F6DB5"/>
<text x="236.0" y="241.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start">256 codes</text>
<rect x="447.6" y="222.0" width="108.8" height="28.0" rx="3" fill="#B4521A"/>
<text x="566.4" y="241.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2433" text-anchor="start">+128  =  3.000 bits per number</text>
<text x="32.0" y="292.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0F1B2D" text-anchor="start">TurboQuant 2-bit</text>
<rect x="230.0" y="274.0" width="217.6" height="28.0" rx="3" fill="#2F6DB5"/>
<text x="236.0" y="293.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="start">256 codes</text>
<rect x="447.6" y="274.0" width="13.6" height="28.0" rx="3" fill="#F2A35E"/>
<text x="471.2" y="293.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1B2433" text-anchor="start">+16  =  2.125 bits per number</text>
<rect x="230.0" y="322.0" width="16.0" height="14.0" rx="2" fill="#2F6DB5"/>
<text x="252.0" y="334.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2433" text-anchor="start">codes</text>
<rect x="340.0" y="322.0" width="16.0" height="14.0" rx="2" fill="#B4521A"/>
<text x="362.0" y="334.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2433" text-anchor="start">scales and zero points (fp16)</text>
<rect x="620.0" y="322.0" width="16.0" height="14.0" rx="2" fill="#F2A35E"/>
<text x="642.0" y="334.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1B2433" text-anchor="start">one norm (fp16)</text>
</svg>

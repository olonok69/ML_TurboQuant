<rect x="160.0" y="186.0" width="9.0" height="2.8" rx="1" fill="#2F6DB5"/>
<rect x="173.5" y="181.8" width="9.0" height="4.2" rx="1" fill="#2F6DB5"/>
<rect x="187.0" y="185.3" width="9.0" height="0.7" rx="1" fill="#2F6DB5"/>
<rect x="200.5" y="159.4" width="9.0" height="26.6" rx="1" fill="#B4521A"/>
<line x1="46.0" y1="186.0" x2="216.0" y2="186.0" stroke="#5F6979" stroke-width="1"/>
<line x1="236.0" y1="186.0" x2="272.0" y2="186.0" stroke="#B4521A" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="278.0" y="92.0" width="198.0" height="222.0" rx="10" fill="#FDFCF9" stroke="#E2DFD6" stroke-width="1.5"/>
<text x="292.0" y="116.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0F1B2D" text-anchor="start">2. Random rotation</text>
<text x="292.0" y="236.0" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3A4556" text-anchor="start">Spin it with a fixed random</text>
<text x="292.0" y="252.2" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3A4556" text-anchor="start">rotation. Now every number</text>
<text x="292.0" y="268.5" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3A4556" text-anchor="start">follows the same, known bell</text>
<text x="292.0" y="284.8" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#3A4556" text-anchor="start">curve.</text>

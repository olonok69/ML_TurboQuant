# Local single-node Elasticsearch matching the dev environment (helm-values: provision/elasticsearch 8.18.0,
# single-node, 2 GB heap, security off). Port 9201 so it does not collide with other local stacks.
services:
  es:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    container_name: es-bench
    environment:
      - discovery.type=single-node
      - cluster.name=es-bench
      - node.name=es-bench
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
      - xpack.security.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "127.0.0.1:9201:9200"
    volumes:
      - esbench:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      retries: 30
volumes:
  esbench:
